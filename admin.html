<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#741d38">
<title>Kalai & Agila — Private Wishes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--maroon:#741d38;--paper:#fffaf3;--ink:#352b2a;--gold:#b38a4b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fffaf4,#f3e0d5);color:var(--ink);font-family:Montserrat,Arial,sans-serif;min-height:100vh}.wrap{max-width:850px;margin:auto;padding:40px 18px 60px}.brand{text-align:center}.eyebrow{font-size:10px;letter-spacing:3px;color:var(--maroon);font-weight:600}.brand h1{font:600 52px "Cormorant Garamond",serif;color:var(--maroon);margin:8px 0}.brand p{color:#78655d}.panel{background:#fff;border:1px solid rgba(179,138,75,.28);border-radius:18px;padding:22px;box-shadow:0 14px 34px rgba(75,30,25,.08);margin-top:24px}.form-row{display:grid;gap:12px}.label{font-size:10px;letter-spacing:1px;color:var(--maroon);font-weight:600}.input,.textarea{width:100%;margin-top:6px;padding:12px;border:1px solid #decfc5;border-radius:10px;background:#fffaf5;font:14px Montserrat;color:var(--ink)}.textarea{min-height:100px;resize:vertical}.btn{border:0;background:var(--maroon);color:#fff;border-radius:999px;padding:12px 18px;font:600 11px Montserrat;cursor:pointer}.btn.secondary{background:#fff;color:var(--maroon);border:1px solid rgba(116,29,56,.3)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.status{font-size:12px;color:#7a675f}.hidden{display:none}.wish{border-top:1px solid #eaded6;padding:18px 0}.wish:first-child{border-top:0}.wish-name{font:600 25px "Cormorant Garamond",serif;color:var(--maroon)}.wish-date{font-size:10px;color:#9a8177;margin-left:6px}.wish-message{font:18px/1.5 "Cormorant Garamond",serif;color:#5f4e48;margin:6px 0}.edit-box{margin-top:10px}.topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.count{font-size:11px;color:#8a7168}.error{color:#a32642}.success{color:#496c48}@media(max-width:520px){.brand h1{font-size:43px}.panel{padding:17px}.wish-name{font-size:23px}}
</style>
</head>
<body>
<main class="wrap">
  <header class="brand"><p class="eyebrow">PRIVATE COUPLE AREA</p><h1>Guest Wishes ♡</h1><p>Only the signed-in wedding admin can view, edit or delete blessings.</p></header>
  <section class="panel" id="loginPanel">
    <form id="loginForm">
      <div class="form-row">
        <label class="label">ADMIN EMAIL<input class="input" id="email" type="email" autocomplete="username" required></label>
        <label class="label">PASSWORD<input class="input" id="password" type="password" autocomplete="current-password" required></label>
        <button class="btn" type="submit">🔐 Sign In</button>
        <p class="status" id="loginStatus">Use the Supabase admin account you created.</p>
      </div>
    </form>
  </section>
  <section class="panel hidden" id="adminPanel">
    <div class="topbar"><div><strong>Received Blessings</strong><div class="count" id="count"></div></div><button class="btn secondary" id="signOut" type="button">Sign Out</button></div>
    <div id="wishesList" style="margin-top:10px"></div>
    <p class="status" id="adminStatus"></p>
  </section>
</main>
<script>
const SUPABASE_URL='https://ttlfusbudyldnpvphtye.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_26k1QQQojNLNNzI4d1iz-A_NrsMjkSZ';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const loginPanel=document.getElementById('loginPanel'), adminPanel=document.getElementById('adminPanel');
const loginStatus=document.getElementById('loginStatus'), adminStatus=document.getElementById('adminStatus');
const list=document.getElementById('wishesList'), count=document.getElementById('count');
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function loadWishes(){
  adminStatus.textContent='Loading blessings…';
  const {data,error}=await sb.from('Guest_wishes').select('id,created_at,name,message').order('created_at',{ascending:false});
  if(error){adminStatus.textContent='Unable to load blessings.';adminStatus.className='status error';return;}
  count.textContent=`${data.length} blessing${data.length===1?'':'s'}`;
  list.innerHTML=data.length?data.map(w=>`<article class="wish" data-id="${w.id}"><div><span class="wish-name">${esc(w.name)}</span><span class="wish-date">${new Date(w.created_at).toLocaleString()}</span></div><p class="wish-message">${esc(w.message)}</p><div class="actions"><button class="btn secondary edit-btn" type="button">✏️ Edit</button><button class="btn delete-btn" type="button">🗑️ Delete</button></div><div class="edit-box hidden"><input class="input edit-name" value="${esc(w.name)}" maxlength="80"><textarea class="textarea edit-message" maxlength="500">${esc(w.message)}</textarea><div class="actions"><button class="btn save-btn" type="button">Save Changes</button><button class="btn secondary cancel-btn" type="button">Cancel</button></div></div></article>`).join(''):'<p class="status">No blessings received yet.</p>';
  adminStatus.textContent='';
  list.querySelectorAll('.edit-btn').forEach(b=>b.onclick=()=>{const a=b.closest('.wish');a.querySelector('.edit-box').classList.remove('hidden');b.classList.add('hidden');});
  list.querySelectorAll('.cancel-btn').forEach(b=>b.onclick=()=>{const a=b.closest('.wish');a.querySelector('.edit-box').classList.add('hidden');a.querySelector('.edit-btn').classList.remove('hidden');});
  list.querySelectorAll('.save-btn').forEach(b=>b.onclick=async()=>{const a=b.closest('.wish');const id=a.dataset.id;const name=a.querySelector('.edit-name').value.trim();const message=a.querySelector('.edit-message').value.trim();if(!name||!message)return; b.disabled=true; const {error}=await sb.from('Guest_wishes').update({name,message}).eq('id',id); b.disabled=false; if(error){adminStatus.textContent='Could not save changes.';adminStatus.className='status error';}else loadWishes();});
  list.querySelectorAll('.delete-btn').forEach(b=>b.onclick=async()=>{const a=b.closest('.wish');if(!confirm('Delete this blessing? This cannot be undone.'))return;b.disabled=true;const {error}=await sb.from('Guest_wishes').delete().eq('id',a.dataset.id);if(error){b.disabled=false;adminStatus.textContent='Could not delete this blessing.';adminStatus.className='status error';}else loadWishes();});
}
async function showSession(session){
  if(session){loginPanel.classList.add('hidden');adminPanel.classList.remove('hidden');await loadWishes();}
  else{loginPanel.classList.remove('hidden');adminPanel.classList.add('hidden');}
}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();loginStatus.textContent='Signing in…';const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){loginStatus.textContent='Login failed. Check your admin email and password.';loginStatus.className='status error';}else{loginStatus.className='status';await showSession(data.session);}});
document.getElementById('signOut').addEventListener('click',async()=>{await sb.auth.signOut();showSession(null);});
sb.auth.getSession().then(({data})=>showSession(data.session));
sb.auth.onAuthStateChange((_event,session)=>showSession(session));
</script>
</body>
</html>
